[package]
name = "gmaps_optimal_placement_web"
description = "The local GUI: a Leptos island of tabs, pins and a picker over the overlay, and the server the CLI's `view` runs"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# ssr + hydrate are mutually exclusive; plain `cargo b` must pick one.
default = ["ssr"]
hydrate = [
    "dep:console_error_panic_hook",
    "dep:gloo-net",
    "dep:js-sys",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
    "leptos/hydrate",
]
ssr = [
    "dep:any_spawner",
    "dep:axum",
    "dep:eyre",
    "dep:futures-util",
    "dep:gmaps_optimal_placement",
    "dep:leptos_axum",
    "dep:tokio",
    "dep:tower-http",
    "dep:v_utils",
    "dep:xdg",
    "leptos/ssr",
]

[target.'cfg(target_arch = "wasm32")'.dependencies]
ev_lib = { workspace = true, features = ["uikit_leptos", "wasm"] }

[dependencies]
any_spawner = { workspace = true, features = ["tokio"], optional = true }
axum = { workspace = true, optional = true }
console_error_panic_hook = { workspace = true, optional = true }
ev_lib = { workspace = true, features = ["uikit_leptos"] }
eyre = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
gloo-net = { workspace = true, optional = true }
gmaps_optimal_placement = { workspace = true, optional = true }
gmaps_optimal_placement_core.workspace = true
gmaps_optimal_placement_overlay.workspace = true
js-sys = { workspace = true, optional = true }
leptos.workspace = true
leptos_axum = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
v_utils = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true }
xdg = { workspace = true, optional = true }

[build-dependencies]
ev_lib_classes.workspace = true

[lints]
workspace = true
