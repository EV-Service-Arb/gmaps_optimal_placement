gmaps_optimal_placement_core.workspace = true
gmaps_optimal_placement_misc.workspace = true
gmaps_optimal_placement_rank.workspace = true
gmaps_optimal_placement_sources.workspace = true
gmaps_optimal_placement_web.workspace = true
indexmap.workspace = true
rusqlite.workspace = true
sa_core.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
smart-default.workspace = true
ureq = { workspace = true, features = ["json"] }
v_utils = { workspace = true, features = ["cli", "macros"] }

[lints]
workspace = true
