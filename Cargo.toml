[workspace]
members = [
    "gmaps_optimal_placement",
    "gmaps_optimal_placement_cli",
    "gmaps_optimal_placement_core",
    "gmaps_optimal_placement_misc",
    "gmaps_optimal_placement_overlay",
    "gmaps_optimal_placement_rank",
    "gmaps_optimal_placement_sources",
    "gmaps_optimal_placement_web",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Valeriy Sakharov <valeratrades@gmail.com>"]
license = "BlueOak-1.0.0"
repository = "https://github.com/EV-Service-Arb/gmaps_optimal_placement"
readme = "README.md"

[workspace.lints.clippy]
float_cmp = "allow"
len_zero = "allow"
if_not_else = "warn"
integer_division = "warn"

[workspace.lints.rust]
stable_features = "allow"
unused_features = "allow"

[workspace.lints.cargo]
non_kebab_case_bins = "allow"

[workspace.dependencies]

base64 = "0.23.1"
clap = "4.6.9"
color-eyre = "0.6.5"
csv = "1.4.0"
evalexpr = "13.1.0"
eyre = "0.6.14"
flate2 = "1.1.11"
futures-util = { version = "0.3.34", default-features = false }
gmaps_optimal_placement = { path = "gmaps_optimal_placement", version = "0.1.0" }
gmaps_optimal_placement_core = { path = "gmaps_optimal_placement_core", version = "0.1.0" }
gmaps_optimal_placement_misc = { path = "gmaps_optimal_placement_misc", version = "0.1.0" }
gmaps_optimal_placement_overlay = { path = "gmaps_optimal_placement_overlay", version = "0.1.0" }
gmaps_optimal_placement_rank = { path = "gmaps_optimal_placement_rank", version = "0.1.0" }
gmaps_optimal_placement_sources = { path = "gmaps_optimal_placement_sources", version = "0.1.0" }
gmaps_optimal_placement_web = { path = "gmaps_optimal_placement_web", version = "0.1.0" }
indexmap = { version = "2.14.2", features = ["serde"] }
insta = "1.49.0"
js-sys = "0.3.106"
proj4rs = "0.3.1"
# the CLI's copy of prod's panel.db, read-only
rusqlite = { version = "0.40.2", features = ["bundled"] }
# the public queries cache's wire, read by the CLI alone
sa_core = { git = "https://github.com/EV-Service-Arb/site_conductor", branch = "main" }
schemars = { version = "1.2.3", features = ["indexmap2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
smart-default = "0.7.1"
strum = { version = "0.28.0", features = ["derive"] }
tokio = { version = "1.54.1", features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1.2.1"
# core's types in the overlay's .d.ts
tsify = "0.5.8"
ureq = "3.5.2"
# the CLI's own settings, and `Timeframe` for the cache ages. Only the CLI depends on it: `_sources`
# is handed resolved durations, so the library and the wasm build stay clear of it.
v_utils = { version = "=2.18.0", default-features = false, features = ["cli", "macros"] }
wasm-bindgen = "=0.2.129"
zip = "9.8.1"

# the GUI (gmaps_optimal_placement_web): a Leptos island over the overlay, served by the CLI's `view`
any_spawner = "0.3.0"
axum = "0.8.9"
console_error_panic_hook = "0.1.7"
# `uikit_leptos` for the picker; the web crate's build script reads its class inventory and tokens
ev_lib = { version = "0.34.2", default-features = false }
ev_lib_classes = "0.20.0"
gloo-net = { version = "0.6.0", features = ["http"] }
leptos = { version = "0.8.22", features = ["islands"] }
leptos_axum = "0.8.10"
tower-http = { version = "0.7.1", features = ["fs", "compression-gzip"] }
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = ["Clipboard", "Document", "Element", "EventTarget", "HtmlElement", "HtmlInputElement", "KeyboardEvent", "Navigator", "Window"] }
xdg = "3.0.0"
